<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d">
  <title id="t">Shawn Leitao - CS Engineering Trainer</title>
  <desc id="d">Original pixel-art night landscape with a trainer silhouette, glowing Poke Balls and a trainer card panel.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04061a"/>
      <stop offset="0.6" stop-color="#14103a"/>
      <stop offset="1" stop-color="#2d1560"/>
    </linearGradient>
    <filter id="glowP" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="ball">
      <circle r="22" fill="#f8fafc"/>
      <path d="M-22 0 A22 22 0 0 1 22 0 Z" fill="#e63946"/>
      <rect x="-22" y="-2.5" width="44" height="5" fill="#0b0b14"/>
      <circle r="22" fill="none" stroke="#0b0b14" stroke-width="3"/>
      <circle r="7" fill="#f8fafc" stroke="#0b0b14" stroke-width="3"/>
      <circle r="3" fill="#7dd3fc"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="40" y="30" width="3" height="3"/>
    <rect x="130" y="18" width="2" height="2"/>
    <rect x="190" y="60" width="3" height="3"/>
    <rect x="250" y="25" width="2" height="2"/>
    <rect x="310" y="48" width="3" height="3"/>
    <rect x="380" y="20" width="2" height="2"/>
    <rect x="440" y="62" width="2" height="2"/>
    <rect x="500" y="30" width="3" height="3"/>
    <rect x="560" y="14" width="2" height="2"/>
    <rect x="600" y="70" width="3" height="3"/>
    <rect x="690" y="16" width="2" height="2"/>
    <rect x="980" y="22" width="3" height="3"/>
    <rect x="970" y="130" width="2" height="2"/>
    <rect x="20" y="110" width="2" height="2"/>
    <rect x="90" y="95" width="3" height="3"/>
    <rect x="270" y="105" width="2" height="2"/>
    <rect x="350" y="92" width="2" height="2"/>
    <rect x="520" y="95" width="2" height="2"/>
    <rect x="640" y="125" width="2" height="2"/>
    <rect x="930" y="150" width="3" height="3"/>
    <rect x="810" y="130" width="2" height="2"/>
    <rect x="720" y="140" width="2" height="2"/>
  </g>
  <g fill="#7dd3fc" shape-rendering="crispEdges">
    <rect x="160" y="40" width="4" height="4"><animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="420" y="38" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="860" y="60" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="585" y="40" width="4" height="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#c4b5fd" shape-rendering="crispEdges">
    <rect x="700" y="100" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></rect>
    <rect x="60" y="150" width="4" height="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- moon -->
  <g filter="url(#glowP)">
    <circle cx="82" cy="62" r="26" fill="#e9e7ff"/>
  </g>
  <g fill="#c7c3ee" shape-rendering="crispEdges">
    <rect x="70" y="52" width="8" height="8"/>
    <rect x="88" y="68" width="10" height="8"/>
    <rect x="72" y="72" width="6" height="6"/>
  </g>

  <!-- far mountains -->
  <path shape-rendering="crispEdges" fill="#1c1b52" d="M0 270 V205 H40 V185 H80 V165 H120 V150 H160 V170 H200 V190 H260 V170 H300 V150 H340 V130 H380 V112 H420 V130 H460 V150 H520 V170 H560 V150 H600 V132 H640 V150 H700 V170 H760 V150 H800 V132 H840 V150 H900 V180 H960 V200 H1000 V270 Z"/>
  <!-- near hills -->
  <path shape-rendering="crispEdges" fill="#120f36" d="M0 270 V225 H60 V210 H120 V200 H180 V212 H240 V225 H320 V210 H400 V195 H460 V210 H540 V225 H620 V212 H700 V200 H780 V215 H860 V228 H940 V215 H1000 V270 Z"/>

  <!-- pixel pines -->
  <g fill="#0b2a2a" shape-rendering="crispEdges">
    <rect x="300" y="236" width="8" height="34"/><rect x="288" y="244" width="32" height="8"/><rect x="292" y="232" width="24" height="8"/><rect x="298" y="222" width="12" height="8"/>
    <rect x="340" y="244" width="6" height="26"/><rect x="330" y="250" width="26" height="6"/><rect x="334" y="240" width="18" height="6"/><rect x="338" y="232" width="10" height="6"/>
    <rect x="560" y="238" width="8" height="32"/><rect x="548" y="246" width="32" height="8"/><rect x="552" y="234" width="24" height="8"/><rect x="558" y="224" width="12" height="8"/>
    <rect x="610" y="246" width="6" height="24"/><rect x="600" y="252" width="26" height="6"/><rect x="604" y="242" width="18" height="6"/><rect x="608" y="234" width="10" height="6"/>
    <rect x="800" y="240" width="8" height="30"/><rect x="788" y="248" width="32" height="8"/><rect x="792" y="236" width="24" height="8"/><rect x="798" y="226" width="12" height="8"/>
  </g>

  <!-- ground -->
  <rect y="270" width="1000" height="50" fill="#0a0d1f"/>
  <rect y="270" width="1000" height="5" fill="#16645a" shape-rendering="crispEdges"/>
  <g fill="#1f8a78" shape-rendering="crispEdges">
    <rect x="20" y="266" width="4" height="4"/><rect x="60" y="264" width="4" height="6"/>
    <rect x="240" y="266" width="4" height="4"/><rect x="420" y="264" width="4" height="6"/>
    <rect x="700" y="266" width="4" height="4"/><rect x="940" y="264" width="4" height="6"/>
  </g>
  <g fill="#1a1f45" shape-rendering="crispEdges">
    <rect x="0" y="290" width="1000" height="4"/>
    <rect x="0" y="306" width="1000" height="4"/>
  </g>

  <!-- trainer silhouette -->
  <g transform="translate(120,165)" fill="#04050c" shape-rendering="crispEdges" filter="url(#glowS)">
    <rect x="21" y="0" width="28" height="7"/>
    <rect x="14" y="7" width="42" height="7"/>
    <rect x="56" y="7" width="14" height="7"/>
    <rect x="21" y="14" width="28" height="7"/>
    <rect x="28" y="21" width="14" height="7"/>
    <rect x="7" y="28" width="56" height="7"/>
    <rect x="0" y="28" width="7" height="35"/>
    <rect x="7" y="35" width="56" height="14"/>
    <rect x="14" y="49" width="42" height="21"/>
    <rect x="14" y="70" width="14" height="28"/>
    <rect x="42" y="70" width="14" height="28"/>
    <rect x="7" y="98" width="21" height="7"/>
    <rect x="42" y="98" width="21" height="7"/>
  </g>
  <g fill="#7dd3fc" shape-rendering="crispEdges" filter="url(#glowS)">
    <rect x="144" y="180" width="5" height="4"/>
    <rect x="161" y="180" width="5" height="4"/>
  </g>
  <!-- cap accent -->
  <rect x="141" y="172" width="28" height="3" fill="#e63946" shape-rendering="crispEdges"/>

  <!-- glowing Poke Balls -->
  <g filter="url(#glowP)">
    <use href="#ball" transform="translate(640,58)"/>
  </g>
  <g filter="url(#glowS)">
    <use href="#ball" transform="translate(262,252) scale(0.6)"/>
    <use href="#ball" transform="translate(905,255) scale(0.75)"/>
  </g>

  <!-- title block -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="300" y="128" font-size="48" fill="#ffffff" filter="url(#glowS)" letter-spacing="2">SHAWN LEITAO</text>
    <text x="302" y="162" font-size="21" fill="#8fd3ff" letter-spacing="3">CS ENGINEERING TRAINER</text>
    <text x="302" y="200" font-size="20" fill="#ff4d6d">Gotta Code 'Em All!</text>
    <rect x="302" y="210" width="190" height="3" fill="#7c3aed" shape-rendering="crispEdges"/>
  </g>

  <!-- trainer card panel -->
  <g shape-rendering="crispEdges">
    <rect x="722" y="28" width="248" height="86" fill="#0b1026" fill-opacity="0.88" stroke="#7c3aed" stroke-width="3"/>
    <rect x="728" y="34" width="236" height="74" fill="none" stroke="#2b2f6b" stroke-width="1"/>
    <rect x="732" y="42" width="6" height="6" fill="#ff4d6d"/>
  </g>
  <g font-family="'Courier New', Courier, monospace" font-weight="bold">
    <text x="746" y="49" font-size="12" fill="#ff4d6d" letter-spacing="2">TRAINER CARD</text>
    <text x="736" y="70" font-size="16" fill="#ffffff">@gotlolfourt</text>
    <text x="736" y="87" font-size="11" fill="#8fd3ff">CLASS : DEV IN TRAINING</text>
    <text x="736" y="102" font-size="11" fill="#a78bfa">STATUS: LEVELING UP</text>
  </g>
</svg>
